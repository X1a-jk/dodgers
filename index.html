        async function renderSeasonRosterTable() {
            const year = $('#sr-year').value;
            const cur = ((typeof FILE_INDEX !== 'undefined' ? FILE_INDEX : {}).currentSeason)
                || String(new Date().getFullYear());
            const body = $('#sr-body');
            const hint = $('#sr-hint');
            body.innerHTML = '<div class="schedule-loading"><div>⏳ 正在加载阵容...</div></div>';

            let data = null, source = '';
            const paths = [];
            if (year === cur) paths.push(['data/season-roster.json', 'current']);
            paths.push([`seasons/${year}/snapshots/season-roster.json`, 'snapshot']);
            if (year === cur) paths.push(['data/season-roster.json.bak', 'bak']);
            for (const [p, s] of paths) {
                try {
                    const r = await fetch(p + '?v=' + Date.now());
                    if (r.ok) { data = await r.json(); source = s; break; }
                } catch (e) { /* try next */ }
            }
            if (!data || !Array.isArray(data.players)) {
                body.innerHTML = `<div class="schedule-error"><strong>${year} 赛季阵容数据不存在</strong><br>
                    该年份封存时未快照 season-roster.json，或赛季尚未开始。</div>`;
                hint.textContent = '';
                return;
            }

            const sm = data.summary || {};
            const chip = (label, val, color) =>
                `<div class="dashboard-card" style="text-align:center;padding:12px 8px;"><div style="font-size:1.4rem;font-weight:900;color:${color};">${val}</div><div class="dc-stats">${label}</div></div>`;

            const rows = data.players.map(p => {
                const st = SR_STATUS[p.status] || { cn: p.statusCn || p.status, cls: 'tag-blue' };
                const batLine = p.bat ? `打击 ${p.bat.avg} · ${p.bat.hr} HR · ${p.bat.rbi} RBI` : '';
                const pitLine = p.pit ? `投球 ${p.pit.w}-${p.pit.l} · ${p.pit.era} ERA · ${p.pit.so} K${p.pit.sv ? ' · ' + p.pit.sv + ' SV' : ''}` : '';
                const statLine = [batLine, pitLine].filter(Boolean).join('<br>') || '-';
                const trail = [];
                if (p.joined) trail.push(`<span class="tag tag-green">＋ ${p.joined}</span>`);
                if (!p.joined && p.status !== 'departed') trail.push('<span class="dc-stats">季初在队</span>');
                if (p.departed) trail.push(`<span class="tag tag-red">－ ${p.departed}</span>`);
                const lad = p.status === 'departed' ? '' : (p.status === 'a' || p.status === 'active' ? 'background:rgba(0,90,156,0.18);' : '');
                return `<tr style="${lad}">
                    <td><span class="st-team">${p.name}</span></td>
                    <td>${p.pos || '-'}</td>
                    <td>${p.g}</td>
                    <td class="dc-stats">${statLine}</td>
                    <td><span class="tag ${st.cls}">${st.cn}</span></td>
                    <td>${trail.join(' ') || '-'}</td>
                </tr>`;
            }).join('');

            hint.textContent = `${data.season} 赛季 · ${data.players.length} 人 · 按出场数排序`;
            body.innerHTML = `
                <div class="dashboard-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px;">
                    ${chip('总出场人数', sm.total ?? '-', '#4fc3f7')}
                    ${chip('活跃', sm.current ?? '-', '#22c55e')}
                    ${chip('伤病名单', sm.il ?? '-', '#eab308')}
                    ${chip('小联盟', sm.minors ?? '-', '#4fc3f7')}
                    ${chip('已离队', sm.departed ?? '-', '#ef4444')}
                    ${chip('中途加入', sm.joinedMidseason ?? '-', '#f5b942')}
                </div>
                <div class="dashboard-card" style="overflow-x:auto;">
                    <table class="st-table compact">
                        <thead><tr><th>球员</th><th>位置</th><th>出场</th><th>赛季数据</th><th>现状</th><th>赛季轨迹</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
                <div class="data-age">数据时间：${data.generatedAt ? new Date(data.generatedAt).toLocaleString('zh-CN') : '未知'} · 来源：MLB Stats API + transactions 全量解析（${source === 'snapshot' ? '年份封存快照' : '实时数据'}）</div>
            `;
        }

        async function applyOctoberTheme() {
            try {
                let oct = new Date().getMonth() === 9;
                try {
                    const res = await fetch('data/postseason.json?v=' + Date.now());
                    if (res.ok) {
                        const d = await res.json();
                        if (d.postseasonPublished) oct = true;
                    }
                } catch (e) { /* 文件不存在则仅按日期判断 */ }
                if (oct) {
                    document.body.classList.add('october');
                    const banner = $('#october-banner');
                    if (banner) banner.style.display = '';
                }
            } catch (e) { /* 主题失败不影响功能 */ }

            const idx = (typeof FILE_INDEX !== 'undefined') ? FILE_INDEX : (window.FILE_INDEX || {});

            const set = new Set();
            ['weekly', 'daily', 'postseason'].forEach(k => (idx[k] || []).forEach(f => { if (f.season) set.add(f.season); }));

                            <span class="preview-title" id="${type}-title">选择一个文件</span>
                            <div class="preview-actions">
                                <button class="btn btn-ghost" id="${type}-raw" disabled onclick="openRaw('${folder}','')">打开原文件</button>
                            </div>
                        </div>
                        <div class="preview-body" id="${type}-preview">
                            <div class="empty-state">
                                <div class="empty-state-icon">📄</div>
                                <h3>选择左侧文件查看内容</h3>
                                <p>周报与日报均为 Markdown 格式，会在这里自动渲染成网页。</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function filterFiles(type, query) {
            const q = (query || '').trim().toLowerCase();
            const yearSel = $(`#${type}-year`);
            const year = yearSel ? yearSel.value : '';
            $$(`#${type}-list .module-file-item`).forEach(el => {
                const label = el.dataset.label.toLowerCase();
                const matchQ = !q || label.includes(q);
                const matchY = !year || el.dataset.season === year;
                el.style.display = (matchQ && matchY) ? '' : 'none';
            });
        }

        async function selectFile(type, filename) {
            const entry = ((typeof FILE_INDEX !== 'undefined' ? FILE_INDEX : {})[type] || [])
                .find(x => x.name === filename);
            const folder = (entry && entry.folder)
                || (MODULE_META[type] || {}).folder
                || (type === 'weekly' ? 'weekly' : 'roster');
            const preview = $(`#${type}-preview`);
            const title = $(`#${type}-title`);
            const rawBtn = $(`#${type}-raw`);

            // Update active state
            $$(`#${type}-list .module-file-item`).forEach(el => {
                el.classList.toggle('active', el.dataset.file === filename);
            });

            title.textContent = filename;
            rawBtn.disabled = false;
            rawBtn.onclick = () => window.open(`${folder}/${filename}`, '_blank');

            preview.innerHTML = '<div class="loading">⏳ 正在加载并渲染文档...</div>';

            try {
                const res = await fetch(`${folder}/${filename}`);
                if (!res.ok) throw new Error(`无法读取文件 (HTTP ${res.status})`);
                const md = await res.text();
                const html = marked.parse(md);
                preview.innerHTML = `<div class="markdown-body">${html}</div>`;
            } catch (err) {
                preview.innerHTML = `
                    <div class="error-box">
                        <strong>加载失败</strong><br>
                        ${err.message}<br><br>
                        这通常是因为用 <code>file://</code> 协议直接打开页面导致的本地文件访问限制。<br>
                        建议通过本地服务器访问：在 PowerShell 里运行 <code>python -m http.server 8080</code>，然后打开 <code>http://localhost:8080</code>。
                    </div>
                `;
            }
        }

        /* ---------- 球员对比 ---------- */
        let cmpData = null;       // depth-chart.json
        let cmpPool = [];         // 去重后的球员池
        let cmpLeft = null, cmpRight = null;
        let cmpPendingLeft = null;  // 命令面板跳转时的预选球员

        function ipToFloat(ip) {
            if (ip == null) return 0;
            const s = String(ip);
            const i = s.indexOf('.');
            if (i < 0) return parseFloat(s) || 0;
            const whole = parseInt(s.slice(0, i)) || 0;
            const frac = parseInt(s.slice(i + 1)) || 0;
            return whole + frac / 3;
        }

        function num(v) {
            if (v == null) return null;
            const n = parseFloat(v);
            return isNaN(n) ? null : n;
        }

        async function renderComparePage() {
            const content = $('#content');
            content.innerHTML = '<div class="schedule-loading"><div>⏳ 正在加载球员数据...</div></div>';
            let data = null;
            try {
                const res = await fetch('data/depth-chart.json?v=' + Date.now());
                if (!res.ok) throw new Error('无法读取');
                data = await res.json();
            } catch (e) {
                try {
                    const bak = await fetch('data/depth-chart.json.bak');
                    if (!bak.ok) throw new Error('备份也读取失败');
                    data = await bak.json();
                } catch (e2) {
                    content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>名单数据读取失败</h3><p>请先运行每日管线生成 depth-chart.json</p></div>';
                    return;
                }
            }
            cmpData = data;
            const map = {};
            (data.columns || []).forEach(col => (col.players || []).forEach(p => { map[p.id] = p; }));
            (data.starters || []).forEach(p => { map[p.id] = p; });
            (data.relievers || []).forEach(p => { map[p.id] = p; });
            cmpPool = Object.values(map).sort((a, b) => a.name.localeCompare(b.name));

            // 默认对比：Mookie Betts vs Freddie Freeman（经典示例）；命令面板跳转则预选指定球员
            let defL, defR;
            if (cmpPendingLeft) {
                defL = cmpPool.find(p => String(p.id) === String(cmpPendingLeft.id)) || cmpPool[0];
                defR = cmpPool.find(p => String(p.id) !== String(defL.id) && cmpPlayerType(p) === cmpPlayerType(defL)) || cmpPool.find(p => String(p.id) !== String(defL.id)) || cmpPool[0];
                cmpPendingLeft = null;
            } else {
                defL = cmpPool.find(p => p.name === 'Mookie Betts') || cmpPool[0];
                defR = cmpPool.find(p => p.name === 'Freddie Freeman' && String(p.id) !== String(defL.id)) || cmpPool[1] || cmpPool[0];
            }
            cmpLeft = defL; cmpRight = defR;
            renderCompare();
        }

        async function refreshCompare() {
            await renderComparePage();
        }

        function cmpPlayerType(p) {
            const hasBat = p.bat && p.bat.g > 0 && (num(p.bat.avg) || 0) > 0;
            const hasPit = p.pitch && p.pitch.g > 0;
            if (hasBat && hasPit) return 'twp';
            if (hasPit) return 'pitcher';
            return 'hitter';
        }

        function cmpHeadCard(p) {
            const type = cmpPlayerType(p);
            const twp = type === 'twp' ? '<span class="cmp-twp-badge">二刀流</span>' : '';
            const img = p.headshot ? `<img src="${p.headshot}" alt="${p.name}" onerror="this.style.display='none'">` : '';
            return `<div class="cmp-head">
                ${img}
                <div class="cmp-head-info">
                    <div class="cmp-head-name">${p.name} ${twp}</div>
                    <div class="cmp-head-sub">
                        <span>#${p.jersey || '-'} · ${p.pos}</span>
                        <span class="tag ${p.statusCode === 'A' ? 'tag-green' : ''}">${p.status}</span>
                        ${p.reportUrl ? `<a href="${p.reportUrl}" target="_blank">球探报告 →</a>` : ''}
                    </div>
                </div>
            </div>`;
        }

        function renderCompare() {
            const content = $('#content');
            if (!cmpLeft || !cmpRight) return;
            const opts = (sel) => cmpPool.map(p =>
                `<option value="${p.id}" ${String(sel.id) === String(p.id) ? 'selected' : ''}>${p.name}（${p.pos} · ${p.status}）</option>`
            ).join('');

            content.innerHTML = `
                <div class="cmp-pickers">
                    <div class="cmp-picker">
                        <label>球员 A</label>
                        <select id="cmp-sel-left">${opts(cmpLeft)}</select>
                    </div>
                    <div class="cmp-vs">VS</div>
                    <div class="cmp-picker">
                        <label>球员 B</label>
                        <select id="cmp-sel-right">${opts(cmpRight)}</select>
                    </div>
                </div>
                <div id="cmp-result"></div>`;

            $('#cmp-sel-left').onchange = e => {
                cmpLeft = cmpPool.find(p => String(p.id) === e.target.value) || cmpLeft;
                renderCompareResult();
            };
            $('#cmp-sel-right').onchange = e => {
                cmpRight = cmpPool.find(p => String(p.id) === e.target.value) || cmpRight;
                renderCompareResult();
            };
            renderCompareResult();
        }

        const CMP_HIT_ROWS = [
            { key: 'g',    label: '出场',   better: 'high', fmt: v => String(v) },
            { key: 'avg',  label: '打击率', better: 'high', fmt: v => v.toFixed(3).replace(/^0/, '') },
            { key: 'obp',  label: '上垒率', better: 'high', fmt: v => v.toFixed(3).replace(/^0/, '') },
            { key: 'slg',  label: '长打率', better: 'high', fmt: v => v.toFixed(3).replace(/^0/, '') },
            { key: 'ops',  label: 'OPS',    better: 'high', fmt: v => v.toFixed(3).replace(/^0/, '') },
            { key: 'hr',   label: '本垒打', better: 'high', fmt: v => String(v) },
            { key: 'rbi',  label: '打点',   better: 'high', fmt: v => String(v) },
            { key: 'sb',   label: '盗垒',   better: 'high', fmt: v => String(v) },
        ];
        const CMP_PITCH_ROWS = [
            { key: 'g',    label: '出场', better: 'high', fmt: v => String(v) },
            { key: 'gs',   label: '先发', better: 'high', fmt: v => String(v) },
            { key: 'w',    label: '胜',   better: 'high', fmt: v => String(v) },
            { key: 'l',    label: '负',   better: 'low',  fmt: v => String(v) },
            { key: 'era',  label: 'ERA',  better: 'low',  fmt: v => v.toFixed(2) },
            { key: 'whip', label: 'WHIP', better: 'low',  fmt: v => v.toFixed(2) },
            { key: 'so',   label: '三振', better: 'high', fmt: v => String(v) },
            { key: 'ip',   label: '局数', better: 'high', fmt: v => Math.floor(v) + '.' + Math.round((v % 1) * 3), raw: ipToFloat },
        ];

        function cmpRowHTML(row, aRaw, bRaw) {
            const conv = row.raw || num;
            const a = aRaw == null ? null : conv(aRaw);
            const b = bRaw == null ? null : conv(bRaw);
            if (a == null && b == null) return '';
            let aWin = null;
            if (a != null && b != null && Math.abs(a - b) > 1e-9) {
                aWin = row.better === 'high' ? a > b : a < b;
            }
            const scale = Math.max(a ?? 0, b ?? 0, 0);
            const denom = scale > 0 ? scale : 1;
            const aPct = a == null ? 0 : Math.max(4, (a / denom) * 100);
            const bPct = b == null ? 0 : Math.max(4, (b / denom) * 100);
            const aCls = aWin == null ? '' : (aWin ? 'win' : 'lose');
            const bCls = aWin == null ? '' : (aWin ? 'lose' : 'win');
            return `<div class="cmp-row">
                <div class="cmp-cell">
                    <span class="cmp-val ${aCls}">${a == null ? '—' : row.fmt(a)}</span>
                    <div class="cmp-bar-wrap"><div class="cmp-bar ${aCls}" style="width:${aPct}%"></div></div>
                </div>
                <div class="cmp-label">${row.label}</div>
                <div class="cmp-cell right">
                    <div class="cmp-bar-wrap"><div class="cmp-bar right ${bCls}" style="width:${bPct}%"></div></div>
                    <span class="cmp-val ${bCls}">${b == null ? '—' : row.fmt(b)}</span>
                </div>
            </div>`;
        }

        function cmpSection(title, rows, aStats, bStats, aName, bName) {
            const body = rows.map(r => cmpRowHTML(r, aStats ? aStats[r.key] : null, bStats ? bStats[r.key] : null)).join('');
            if (!body) return '';
            let aWins = 0, bWins = 0;
            rows.forEach(r => {
                const conv = r.raw || num;
                const a = aStats ? conv(aStats[r.key]) : null;
                const b = bStats ? conv(bStats[r.key]) : null;
                if (a != null && b != null && Math.abs(a - b) > 1e-9) {
                    const aWin = r.better === 'high' ? a > b : a < b;
                    if (aWin) aWins++; else bWins++;
                }
            });
            const leader = aWins === bWins ? '两人旗鼓相当' : (aWins > bWins ? `${aName} 占优（${aWins}:${bWins}）` : `${bName} 占优（${bWins}:${aWins}）`);
            return `<div class="cmp-section-title">${title}</div><div class="cmp-rows">${body}</div>
                <div class="cmp-summary">🏆 ${title}项对比：<strong>${aName}</strong> 胜出 ${aWins} 项 · <strong>${bName}</strong> 胜出 ${bWins} 项 —— ${leader}</div>`;
        }

        function renderCompareResult() {
            const box = $('#cmp-result');
            if (!box || !cmpLeft || !cmpRight) return;
            const a = cmpLeft, b = cmpRight;
            const aBat = cmpPlayerType(a) !== 'pitcher' && a.bat && a.bat.g > 0 ? a.bat : null;
            const bBat = cmpPlayerType(b) !== 'pitcher' && b.bat && b.bat.g > 0 ? b.bat : null;
            const aPit = (a.pitch && (a.pitch.gs > 0 || (!aBat && a.pitch.g > 0))) ? a.pitch : null;
            const bPit = (b.pitch && (b.pitch.gs > 0 || (!bBat && b.pitch.g > 0))) ? b.pitch : null;

            let html = `<div class="cmp-head-row">${cmpHeadCard(a)}<div class="cmp-vs">VS</div>${cmpHeadCard(b)}</div>`;
            if (aBat || bBat) html += cmpSection('⚾ 打击', CMP_HIT_ROWS, aBat, bBat, a.name, b.name);
            if (aPit || bPit) html += cmpSection('🎯 投球', CMP_PITCH_ROWS, aPit, bPit, a.name, b.name);
            if (html.indexOf('cmp-section-title') < 0) {
                html += '<div class="empty-state"><div class="empty-state-icon">📭</div><h3>两人都没有本赛季数据</h3></div>';
            }
            box.innerHTML = html;
        }

        /* ---------- 新闻中心 ---------- */
        const NEWS_TOPICS = {
            all: '全部', top: '🔥 重点', injury: '伤病', roster: '阵容变动',
            farm: '农场新秀', game: '比赛数据', offfield: '场外流言'
        };
        const NEWS_SRC_LABEL = { mlb: 'MLB.com', dn: 'Dodgers Nation', athletic: 'The Athletic' };
        let newsCN = null;        // news-cn.json 内容
        let newsRaw = {};         // 原始缓存 {mlb:{...}, dn:{...}, athletic:{...}}
        let newsTopic = 'all';
        let newsXLoaded = false;

        function newsRelTime(iso) {
            if (!iso) return '';
            const diff = (Date.now() - new Date(iso).getTime()) / 1000;
            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
            return Math.floor(diff / 86400) + ' 天前';
        }

        async function renderNewsPage() {
            const content = $('#content');
            content.innerHTML = `
                <div class="schedule-loading"><div>⏳ 正在加载新闻中心...</div></div>`;
            newsCN = null;
            newsRaw = {};
            newsTopic = 'all';

            // 并行加载：中文摘要 + 各源缓存
            const [cnRes, statusRes] = await Promise.allSettled([
                fetch('news/news-cn.json?v=' + Date.now()),
                fetch('/api/news/status?v=' + Date.now())
            ]);

            if (cnRes.status === 'fulfilled' && cnRes.value.ok) {
                try { newsCN = await cnRes.value.json(); } catch (e) { newsCN = null; }
            }
            for (const mid of ['mlb', 'dn', 'athletic']) {
                try {
                    const r = await fetch(`news/cache/${mid}.json?v=` + Date.now());
                    if (r.ok) newsRaw[mid] = await r.json();
                } catch (e) { /* 单个源失败不阻塞 */ }
            }

            content.innerHTML = `
                <div class="news-digest" id="news-digest"></div>
                <div class="news-controls">
                    <div class="news-tabs" id="news-tabs"></div>
                    <div class="news-refresh-group" id="news-refresh-group"></div>
                </div>
                <div id="news-body"></div>
                <div class="news-x-card">
                    <div class="news-x-head">
                        <h3>𝕏 Dodgers 官方动态</h3>
                        <button class="news-src-btn" onclick="renderNewsX(true)">⟳ 重新加载</button>
                    </div>
                    <div class="news-x-hint">由浏览器直连 x.com 加载，若无法显示多为网络问题</div>
                    <div id="news-x-widget"></div>
                </div>`;

            renderNewsDigest();
            renderNewsTabs();
            renderNewsRefreshGroup(statusRes);
            renderNewsBody();
            renderNewsX(false);
        }

        function renderNewsDigest() {
            const box = $('#news-digest');
            if (!box) return;
            if (newsCN && newsCN.digest && newsCN.digest.length) {
                const age = (Date.now() - new Date(newsCN.generated).getTime()) / 3600000;
                const stale = age > 6;
                box.innerHTML = `
                    <div class="news-digest-head">
                        <h3>📌 要闻摘要</h3>
                        <span class="news-digest-time ${stale ? 'stale' : ''}">
                            AI 中文摘要 · 更新于 ${newsRelTime(newsCN.generated)}${stale ? '（较旧，定时任务每 3 小时自动更新）' : ''}
                        </span>
                    </div>
                    <ul>${newsCN.digest.map(d => `<li>${d}</li>`).join('')}</ul>`;
            } else {
                box.innerHTML = `
                    <div class="news-digest-head"><h3>📌 要闻摘要</h3></div>
                    <div class="news-digest-fallback">
                        中文摘要尚未生成（定时任务每 3 小时自动生成一次）。
                        下方列表为各源最新标题，点右侧按钮可手动刷新单个新闻源。
                    </div>`;
            }
        }

        function renderNewsTabs() {
            const box = $('#news-tabs');
            if (!box) return;
            box.innerHTML = '';
            Object.entries(NEWS_TOPICS).forEach(([key, label]) => {
                if (key !== 'all' && key !== 'top' && !newsCN) return; // 无摘要时不显示分类
                const b = document.createElement('button');
                b.className = 'news-tab' + (newsTopic === key ? ' active' : '');
                b.textContent = label;
                b.onclick = () => { newsTopic = key; renderNewsTabs(); renderNewsBody(); };
                box.appendChild(b);
            });
        }

        function renderNewsRefreshGroup(statusRes) {
            const box = $('#news-refresh-group');
            if (!box) return;
            box.innerHTML = '';
            let statusMap = {};
            if (statusRes && statusRes.status === 'fulfilled' && statusRes.value.ok) {
                statusRes.value.json().then(j => {
                    Object.entries(j.modules || {}).forEach(([mid, s]) => {
                        const dot = document.querySelector(`#news-dot-${mid}`);
                        if (dot) dot.className = 'dot ' + newsDotClass(s.updated);
                    });
                }).catch(() => {});
            }
            ['mlb', 'dn', 'athletic'].forEach(mid => {
                const b = document.createElement('button');
                b.className = 'news-src-btn';
                b.id = `news-refresh-${mid}`;
                b.innerHTML = `<span class="dot gray" id="news-dot-${mid}"></span>${NEWS_SRC_LABEL[mid]}`;
                b.title = '单独刷新此新闻源（网络不好时只重刷这个）';
                b.onclick = () => refreshNewsSource(mid);
                box.appendChild(b);
            });
        }

        function newsDotClass(updated) {
            if (!updated) return 'gray';
            const diff = (Date.now() - new Date(updated).getTime()) / 1000;
            if (diff < 600) return 'green';
            if (diff < 3600) return 'yellow';
            return 'gray';
        }

        async function refreshNewsSource(mid) {
            const btn = $(`#news-refresh-${mid}`);
            if (btn) btn.disabled = true;
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 25000);
            try {
                const r = await fetch(`/api/news/refresh?id=${mid}`, { method: 'POST', signal: ctrl.signal });
                const j = await r.json();
                if (j.ok && j.module) {
                    newsRaw[mid] = j.module;
                } else if (j.module && j.module.items && j.module.items.length) {
                    newsRaw[mid] = j.module;
                    newsBar(`⚠ ${NEWS_SRC_LABEL[mid]} 刷新失败：${j.error || '网络错误'}，已保留上次内容`);
                } else {
                    newsBar(`⚠ ${NEWS_SRC_LABEL[mid]} 刷新失败：${j.error || '网络错误'}`);
                }
            } catch (e) {
                newsBar(`⚠ ${NEWS_SRC_LABEL[mid]} 刷新失败：${e.name === 'AbortError' ? '请求超时' : '无法连接本地服务'}`);
            } finally {
                clearTimeout(timer);
                if (btn) btn.disabled = false;
                const dot = $(`#news-dot-${mid}`);
                const c = newsRaw[mid];
                if (dot && c) dot.className = 'dot ' + newsDotClass(c.updated);
                renderNewsBody();
            }
        }

        async function refreshAllNews() {
            for (const mid of ['mlb', 'dn', 'athletic']) {
                await refreshNewsSource(mid);
                await new Promise(r => setTimeout(r, 300));
            }
        }

        function newsBar(msg) {
            const body = $('#news-body');
            if (!body) return;
            let bar = body.querySelector('.news-error-bar');
            if (!bar) {
                bar = document.createElement('div');
                bar.className = 'news-error-bar';
                body.prepend(bar);
            }
            bar.textContent = msg;
            setTimeout(() => bar.remove(), 8000);
        }

        function newsItemHTML(it, showEn) {
            const src = it.source;
            const title = it.title_cn || it.title;
            const en = showEn && it.title_cn && it.title_en && it.title_en !== it.title_cn
                ? `<div class="news-item-en">${it.title_en}</div>` : '';
            const topics = (it.topics || []).map(t =>
                `<span class="news-topic-tag">${NEWS_TOPICS[t] || t}</span>`).join('');
            return `
                <div class="news-item">
                    <div class="news-item-main">
                        <div class="news-item-title">
                            <span class="news-src-tag ${src}">${NEWS_SRC_LABEL[src] || src}</span>
                            <a href="${it.url}" target="_blank" rel="noopener">${title}</a>
                        </div>
                        ${en}
                    </div>
                    <div class="news-item-side">
                        <span>${newsRelTime(it.time)}</span>
                        ${topics}
                    </div>
                </div>`;
        }

        function renderNewsBody() {
            const body = $('#news-body');
            if (!body) return;

            if (newsCN && newsCN.top && newsCN.top.length && (newsTopic === 'all' || newsTopic === 'top')) {
                // 重点新闻合并视图
                let html = '<div class="news-section-title">🔥 重点新闻（多源交叉 / 高信号）</div><div class="news-top-grid">';
                html += newsCN.top.map(c => `
                    <div class="news-top-card">
                        <div class="news-top-flag">重点 · ${c.sources.map(s => NEWS_SRC_LABEL[s] || s).join(' + ')}</div>
                        <div class="news-top-title"><a href="${c.links[0].url}" target="_blank" rel="noopener">${c.title_cn}</a></div>
                        <div class="news-top-meta">
                            <span>${newsRelTime(c.time)}</span>
                            ${c.links.map(l => `<a class="news-src-tag ${l.source}" href="${l.url}" target="_blank" rel="noopener" style="text-decoration:none">${NEWS_SRC_LABEL[l.source] || l.source}</a>`).join('')}
                        </div>
                    </div>`).join('');
                html += '</div>';
                if (newsTopic === 'top') { body.innerHTML = html; return; }
                body.innerHTML = html + newsListHTML();
                return;
            }
            body.innerHTML = newsListHTML();
        }

        function newsListHTML() {
            let items = [];
            if (newsCN && newsCN.items && newsCN.items.length) {
                items = newsCN.items.slice();
                if (newsTopic !== 'all' && newsTopic !== 'top') {
                    items = items.filter(it => (it.topics || []).includes(newsTopic));
                }
                items.sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0));
            } else {
                // 回退：原始英文缓存按时间混排
                Object.entries(newsRaw).forEach(([mid, mod]) => {
                    (mod.items || []).forEach(it => items.push({ ...it, source: mid }));
                });
                items.sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0));
                items = items.slice(0, 30);
            }
            if (!items.length) {
                return '<div class="empty-state"><div class="empty-state-icon">📭</div><h3>该分类暂无新闻</h3><p>点上方按钮刷新新闻源试试</p></div>';
            }
            return '<div class="news-section-title">📋 全部动态</div><div class="news-list">' +
                items.map(it => newsItemHTML(it, !newsCN)).join('') + '</div>';
        }

        function renderNewsX(force) {
            const box = $('#news-x-widget');
            if (!box) return;
            if (force || !newsXLoaded) {
                box.innerHTML = '';
                const a = document.createElement('a');
                a.className = 'twitter-timeline';
                a.href = 'https://x.com/Dodgers';
                a.setAttribute('data-height', '520');
                a.setAttribute('data-theme', 'dark');
                a.setAttribute('data-chrome', 'noheader nofooter transparent noscrollbar');
                a.textContent = 'Posts by @Dodgers';
                box.appendChild(a);
                newsXLoaded = true;
            }
            if (window.twttr && twttr.widgets) {
                twttr.widgets.load(box);
            }
        }

        // X widgets.js 只加载一次
        window.twttr = (function (d, s, id) {
            var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {};
            if (d.getElementById(id)) return t;
            js = d.createElement(s); js.id = id; js.async = true;
            js.src = 'https://platform.twitter.com/widgets.js';
            fjs.parentNode.insertBefore(js, fjs);
            t._e = []; t.ready = function (f) { t._e.push(f); };
            return t;
        }(document, 'script', 'twitter-wjs'));

        /* ---------- 命令面板（Ctrl+K / /） ---------- */
        const PALETTE_PAGES = [
            { id: 'dashboard',     label: '首页概览',       icon: '🏠' },
            { id: 'dashboard_v2',  label: '数据大屏',       icon: '📺' },
            { id: 'standings',     label: '积分榜',         icon: '🏆' },
            { id: 'schedule',      label: '赛程与比赛中心', icon: '📅' },
            { id: 'opponent',      label: '对手情报局',     icon: '🕵️' },
            { id: 'milestones',    label: '里程碑与纪录',   icon: '🎯' },
            { id: 'playoff',       label: '季后赛对阵',     icon: '🍂' },
            { id: 'recap',        label: '常规赛总结',     icon: '🏁' },
            { id: 'seasonroster', label: '历年阵容',       icon: '📜' },
            { id: 'depth',         label: '40 人名单深度图', icon: '📋' },
            { id: 'injuries',      label: '伤病时间线',     icon: '🏥' },
            { id: 'farm',          label: '农场系统',       icon: '🌾' },
            { id: 'transactions',  label: '交易与人员变动', icon: '🔄' },
            { id: 'news',          label: '新闻中心',       icon: '📰' },
            { id: 'reports',       label: '球员报告',       icon: '🧢' },
            { id: 'compare',       label: '球员对比',       icon: '⚔️' },
            { id: 'weekly',        label: '每周战报',       icon: '📊' },
            { id: 'daily',         label: '每日阵容',       icon: '⚾' },
        ];
        let palettePlayers = null;   // 球员池（depth-chart.json 解析后缓存）
        let paletteActive = -1;
        let paletteItems = [];

        async function paletteLoadPlayers() {
            if (palettePlayers) return palettePlayers;
            try {
                const res = await fetch('data/depth-chart.json?v=' + Date.now());
                const data = await res.json();
                const map = {};
                (data.columns || []).forEach(col => (col.players || []).forEach(p => { map[p.id] = p; }));
                (data.starters || []).forEach(p => { map[p.id] = p; });
                (data.relievers || []).forEach(p => { map[p.id] = p; });
                palettePlayers = Object.values(map).sort((a, b) => a.name.localeCompare(b.name));
            } catch (e) {
                palettePlayers = [];
            }
            return palettePlayers;
        }

        function paletteSearch(q) {
            q = q.trim().toLowerCase();
            const items = [];
            const push = (icon, label, type, action) => items.push({ icon, label, type, action });
            // 页面
            PALETTE_PAGES.filter(p => !q || p.label.toLowerCase().includes(q)).slice(0, q ? 4 : 6)
                .forEach(p => push(p.icon, p.label, '页面', () => setPage(p.id)));
            // 球员（需要加载名单）
            if (palettePlayers && q.length >= 1) {
                palettePlayers.filter(p => p.name.toLowerCase().includes(q)).slice(0, 6)
                    .forEach(p => push('👤', `${p.name}（${p.pos} · ${p.status}）`, '球员对比', () => {
                        cmpPendingLeft = p;
                        setPage('compare');
                    }));
            }
            // 周报 / 日报
            if (q) {
                (FILE_INDEX.weekly || []).filter(w => w.label.toLowerCase().includes(q)).slice(0, 3)
                    .forEach(w => push('📊', w.label, '周报', () => {
                        setPage('weekly');
                        setTimeout(() => selectFile('weekly', w.name), 80);
                    }));
                (FILE_INDEX.daily || []).filter(d => d.label.toLowerCase().includes(q)).slice(0, 3)
                    .forEach(d => push('⚾', d.label, '日报', () => {
                        setPage('daily');
                        setTimeout(() => selectFile('daily', d.name), 80);
                    }));
            }
            return items;
        }

        function renderPaletteResults() {
            const input = document.querySelector('.palette-input');
            const box = document.querySelector('.palette-results');
            if (!input || !box) return;
            paletteItems = paletteSearch(input.value);
            paletteActive = paletteItems.length ? 0 : -1;
            if (!paletteItems.length) {
                box.innerHTML = '<div class="palette-empty">没有匹配结果</div>';
                return;
            }
            box.innerHTML = paletteItems.map((it, i) => `
                <div class="palette-item ${i === paletteActive ? 'active' : ''}" data-idx="${i}">
                    <span class="p-icon">${it.icon}</span>
                    <span class="p-label">${it.label}</span>
                    <span class="p-type">${it.type}</span>
                </div>`).join('');
            box.querySelectorAll('.palette-item').forEach(el => {
                el.onclick = () => palettePick(parseInt(el.dataset.idx));
                el.onmouseenter = () => {
                    paletteActive = parseInt(el.dataset.idx);
                    box.querySelectorAll('.palette-item').forEach(x => x.classList.toggle('active', parseInt(x.dataset.idx) === paletteActive));
                };
            });
        }

        function palettePick(i) {
            const it = paletteItems[i];
            if (!it) return;
            closePalette();
            it.action();
        }

        function closePalette() {
            const ov = document.querySelector('.palette-overlay');
            if (ov) ov.remove();
        }

        async function openPalette() {
            if (document.querySelector('.palette-overlay')) return;
            closeGameModal();
            const overlay = document.createElement('div');
            overlay.className = 'palette-overlay';
            overlay.innerHTML = `
                <div class="palette">
                    <div class="palette-input-row">
                        <span class="icon">🔍</span>
                        <input class="palette-input" placeholder="搜索球员、页面、周报、日报..." />
                        <span class="palette-kbd">Esc 关闭</span>
                    </div>
                    <div class="palette-results"></div>
                </div>`;
            overlay.onclick = e => { if (e.target === overlay) closePalette(); };
            document.body.appendChild(overlay);
            const input = overlay.querySelector('.palette-input');
            input.oninput = renderPaletteResults;
            input.onkeydown = e => {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    paletteActive = Math.min(paletteActive + 1, paletteItems.length - 1);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    paletteActive = Math.max(paletteActive - 1, 0);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    palettePick(paletteActive);
                    return;
                } else {
                    return;
                }
                overlay.querySelectorAll('.palette-item').forEach(x => x.classList.toggle('active', parseInt(x.dataset.idx) === paletteActive));
            };
            renderPaletteResults();
            input.focus();
            paletteLoadPlayers().then(() => {
                if (document.querySelector('.palette-overlay')) renderPaletteResults();
            });
        }

        document.addEventListener('keydown', e => {
            const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement && document.activeElement.tagName);
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                openPalette();
            } else if (e.key === '/' && !typing) {
                e.preventDefault();
                openPalette();
            } else if (e.key === 'Escape') {
                if (document.querySelector('.palette-overlay')) closePalette();
                else if (document.querySelector('.game-modal-overlay')) closeGameModal();
            }
        });

        // Initialize
        $$('.nav-item').forEach(el => {
            el.addEventListener('click', e => {
                e.preventDefault();
                setPage(el.dataset.page);
            });
        });

        applyOctoberTheme();
        refreshFileIndex().finally(() => setPage('dashboard'));
    </script>
</body>
</html>
