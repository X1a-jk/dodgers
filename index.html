<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>道奇队数据门户 | Dodgers Analytics Hub</title>
    <script src="portal/marked.min.js"></script>
    <style>
        :root {
            --dodgers-blue: #005A9C;
            --dodgers-light: #1E88E5;
            --dodgers-dark: #0a1628;
            --bg: #0f172a;
            --panel: rgba(30, 41, 59, 0.7);
            --panel-solid: #1e293b;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #ff9800;
            --success: #22c55e;
            --danger: #ef4444;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            background: var(--dodgers-dark);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 100;
        }

        .brand {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--dodgers-blue) 0%, var(--dodgers-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.1rem;
            color: #fff;
            box-shadow: 0 6px 20px rgba(0, 90, 156, 0.35);
        }

        .brand-title {
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.25;
        }

        .brand-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        nav {
            padding: 10px 10px 6px;
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.18) transparent;
        }

        nav::-webkit-scrollbar { width: 5px; }
        nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 4px; }
        nav::-webkit-scrollbar-track { background: transparent; }

        .nav-group-title {
            font-size: 0.66rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 12px 12px 3px;
            opacity: 0.75;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            margin-bottom: 2px;
            border-radius: 9px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(0, 90, 156, 0.25) 0%, rgba(30, 136, 229, 0.12) 100%);
            color: #fff;
            border-left: 3px solid var(--dodgers-light);
        }

        .nav-icon {
            font-size: 1.05rem;
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border);
            font-size: 0.72rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Main */
        .main {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(90deg, rgba(0, 90, 156, 0.18) 0%, transparent 100%);
            border-bottom: 1px solid var(--border);
            padding: 22px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            backdrop-filter: blur(12px);
            z-index: 90;
        }

        .page-title {
            font-size: 1.45rem;
            font-weight: 700;
        }

        .page-title span {
            color: var(--dodgers-light);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 9px 18px;
            border-radius: 8px;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--dodgers-blue) 0%, var(--dodgers-light) 100%);
            color: #fff;
            box-shadow: 0 4px 14px rgba(0, 90, 156, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 90, 156, 0.45);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .content {
            flex: 1;
            padding: 28px 32px 40px;
            overflow-x: hidden;
        }

        /* Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 22px;
            margin-bottom: 32px;
        }

        .portal-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: transform 0.25s, box-shadow 0.25s;
            cursor: pointer;
        }

        .portal-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
            border-color: rgba(255, 255, 255, 0.14);
        }

        .portal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--dodgers-blue), var(--dodgers-light));
        }

        .portal-card.reports::before { background: linear-gradient(90deg, #7c3aed, #a78bfa); }
        .portal-card.weekly::before { background: linear-gradient(90deg, var(--success), #4ade80); }
        .portal-card.daily::before { background: linear-gradient(90deg, var(--accent), #fbbf24); }
        .portal-card.schedule::before { background: linear-gradient(90deg, #ef4444, #f87171); }
        .portal-card.depth::before { background: linear-gradient(90deg, #0ea5e9, #38bdf8); }

        .card-icon {
            font-size: 2.2rem;
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .card-badge {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
        }

        .recent-section {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
        }

        /* Dashboard */
        .dashboard-section {
            margin-bottom: 32px;
        }

        .dashboard-section-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .kpi-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--dodgers-blue), var(--dodgers-light));
        }

        .kpi-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: #fff;
            margin: 8px 0;
            line-height: 1;
        }

        .kpi-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .kpi-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .dashboard-grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 22px;
        }

        .dashboard-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
        }

        .dashboard-card h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .leader-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 0;
            border-bottom: 1px solid var(--border);
        }

        .leader-row:last-child {
            border-bottom: none;
        }

        .leader-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .leader-rank {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
        }

        .leader-rank.top {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }

        .leader-rank.bottom {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .leader-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .leader-stats {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .leader-value {
            font-weight: 700;
            font-size: 1.05rem;
            color: #fff;
        }

        .schedule-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
        }

        .schedule-card:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .schedule-main {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .schedule-opponent {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .schedule-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .schedule-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(0, 90, 156, 0.2);
            color: #fff;
        }

        .schedule-badge.home {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }

        .schedule-badge.away {
            background: rgba(255, 152, 0, 0.2);
            color: var(--accent);
        }

        .weekly-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
        }

        /* Standings (积分榜) */
        .st-card { overflow-x: auto; }
        .st-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            font-variant-numeric: tabular-nums;
        }
        .st-table th {
            text-align: left;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.72rem;
            padding: 6px 8px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .st-table td {
            padding: 8px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .st-table tbody tr:last-child td { border-bottom: none; }
        .st-table tr.st-lad td { background: rgba(0,90,156,0.2); color: #fff; font-weight: 600; }
        .st-table tr.st-lad td:first-child { box-shadow: inset 3px 0 0 var(--dodgers-light); }
        .st-team { font-weight: 700; }
        .st-wc-tag {
            font-size: 0.64rem;
            padding: 1px 6px;
            border-radius: 8px;
            margin-left: 6px;
            font-weight: 700;
            background: rgba(56,189,248,0.18);
            color: #38bdf8;
            vertical-align: middle;
        }
        .st-clinch {
            font-size: 0.64rem;
            padding: 1px 6px;
            border-radius: 8px;
            margin-left: 6px;
            font-weight: 700;
        }
        .st-clinch.y { background: rgba(34,197,94,0.2); color: var(--success); }
        .st-clinch.x { background: rgba(56,189,248,0.2); color: #38bdf8; }
        .st-clinch.e { background: rgba(148,163,184,0.2); color: var(--text-muted); }
        .st-wc-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            font-size: 0.86rem;
            font-variant-numeric: tabular-nums;
        }
        .st-wc-row:last-child { border-bottom: none; }
        .st-wc-row.lad {
            background: rgba(0,90,156,0.2);
            border-radius: 8px;
            border-bottom-color: transparent;
            color: #fff;
            font-weight: 600;
        }
        .st-wc-rank {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.76rem;
            font-weight: 800;
            flex-shrink: 0;
        }
        .st-wc-row.in .st-wc-rank { background: rgba(34,197,94,0.22); color: var(--success); }
        .st-wc-team { flex: 1; font-weight: 700; }
        .st-wc-sub { color: var(--text-muted); font-weight: 400; font-size: 0.76rem; }
        .st-wc-row.lad .st-wc-sub { color: rgba(255,255,255,0.7); }
        .st-wc-gb { font-weight: 700; }
        .st-cutoff {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 10px;
            color: var(--text-muted);
            font-size: 0.7rem;
        }
        .st-cutoff::before, .st-cutoff::after {
            content: '';
            flex: 1;
            border-top: 1px dashed var(--border);
        }
        .st-banner {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .st-banner.ok { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
        .st-banner.warn { background: rgba(255,152,0,0.12); border: 1px solid rgba(255,152,0,0.3); color: #fcd34d; }
        .st-table.compact td { padding: 6px 8px; font-size: 0.82rem; }
        td.st-rank1 { color: var(--success); font-weight: 800; }

        /* Playoff picture (季后赛形势) */
        .sp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-bottom: 26px; }
        @media (max-width: 900px) { .sp-grid { grid-template-columns: 1fr; } }
        .sp-seed-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            font-size: 0.88rem;
            font-variant-numeric: tabular-nums;
        }
        .sp-seed-row:last-child { border-bottom: none; }
        .sp-seed-row.lad {
            background: rgba(0,90,156,0.2);
            border-radius: 8px;
            border-bottom-color: transparent;
            color: #fff;
            font-weight: 600;
        }
        .sp-seed {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.76rem;
            font-weight: 800;
            flex-shrink: 0;
        }
        .sp-seed.division { background: rgba(0,90,156,0.45); color: #fff; }
        .sp-seed.wildCard { background: rgba(56,189,248,0.2); color: #38bdf8; }
        .sp-team { flex: 1; font-weight: 700; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sp-kind-tag {
            font-size: 0.64rem;
            padding: 1px 6px;
            border-radius: 8px;
            margin-left: 6px;
            font-weight: 700;
            vertical-align: middle;
        }
        .sp-kind-tag.division { background: rgba(0,90,156,0.25); color: #7cc4ff; }
        .sp-kind-tag.wildCard { background: rgba(56,189,248,0.15); color: #38bdf8; }
        .sp-sub { color: var(--text-muted); font-weight: 400; font-size: 0.76rem; margin-left: 6px; }
        .sp-seed-row.lad .sp-sub { color: rgba(255,255,255,0.7); }

        /* Injury Timeline (伤病时间线) */
        .inj-timeline {
            position: relative;
            margin-left: 10px;
            padding-left: 26px;
            border-left: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .inj-item { position: relative; }
        .inj-dot {
            position: absolute;
            left: -33px;
            top: 20px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--bg);
        }
        .inj-dot.d10 { background: var(--success); }
        .inj-dot.d15 { background: var(--accent); }
        .inj-dot.d60 { background: var(--danger); }
        .inj-date { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
        .inj-card {
            display: flex;
            gap: 12px;
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
        }
        .inj-card.clickable { cursor: pointer; transition: all 0.15s; }
        .inj-card.clickable:hover { border-color: var(--dodgers-light); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.3); }
        .inj-photo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background: rgba(255,255,255,0.06);
            flex-shrink: 0;
        }
        .inj-info { flex: 1; min-width: 0; }
        .inj-name { font-weight: 700; font-size: 0.92rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .inj-name .dc-jersey { color: var(--text-muted); font-weight: 500; font-size: 0.75rem; }
        .inj-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
        .inj-meta { font-size: 0.78rem; margin-top: 4px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .inj-meta b { color: #fff; }
        .inj-meta .overdue { color: var(--accent); font-weight: 700; }
        .inj-meta .out { color: var(--danger); font-weight: 700; }
        .inj-returns { display: flex; flex-wrap: wrap; gap: 10px; }
        .inj-return-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34,197,94,0.08);
            border: 1px solid rgba(34,197,94,0.25);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.82rem;
        }
        .inj-return-chip b { color: var(--success); }
        .inj-return-chip .dc-jersey { color: var(--text-muted); font-size: 0.72rem; }

        /* Farm System (农场系统) */
        .farm-level {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 10px;
            margin-right: 8px;
        }
        .farm-level.lv-aaa { background: rgba(239,68,68,0.18); color: #fca5a5; }
        .farm-level.lv-aa { background: rgba(255,152,0,0.18); color: #fcd34d; }
        .farm-level.lv-aplus { background: rgba(56,189,248,0.15); color: #38bdf8; }
        .farm-level.lv-a { background: rgba(34,197,94,0.15); color: #86efac; }
        .farm-score { font-size: 1.7rem; font-weight: 900; font-variant-numeric: tabular-nums; }
        .farm-score.win { color: var(--success); }
        .farm-score.loss { color: var(--danger); }
        .farm-hl {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
        }
        .farm-hl-name { font-weight: 700; font-size: 0.88rem; white-space: nowrap; }
        .farm-hl-feats { font-size: 0.82rem; color: var(--text-muted); }
        .farm-hl-feats b { color: #fff; }
        .farm-watch {
            display: inline-block;
            font-size: 0.64rem;
            font-weight: 800;
            padding: 1px 7px;
            border-radius: 8px;
            margin-left: 6px;
            background: rgba(239,68,68,0.18);
            color: #fca5a5;
            vertical-align: middle;
        }
        .farm-team-name { font-weight: 700; font-size: 0.95rem; }

        .mini-list-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .mini-list-item:last-child {
            border-bottom: none;
        }

        .mini-list-item strong {
            color: #fff;
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 8px;
        }

        .tag-red {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .tag-green {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .dashboard-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            color: var(--text-muted);
        }

        .dashboard-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            padding: 16px 20px;
            border-radius: 10px;
            margin: 20px;
        }

        .data-age {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 10px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-list {
            display: grid;
            gap: 10px;
        }

        .file-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            border: 1px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
        }

        .file-row:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--border);
        }

        .file-name {
            font-weight: 600;
            font-size: 0.92rem;
        }

        .file-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Module Layout */
        .module-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 22px;
            height: calc(100vh - 170px);
            min-height: 600px;
        }

        .module-sidebar {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .module-sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
        }

        .module-sidebar-header h3 {
            font-size: 1rem;
            font-weight: 700;
        }

        .module-sidebar-header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .module-search {
            padding: 0 16px 12px;
            border-bottom: 1px solid var(--border);
        }

        .module-search input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }

        .module-search input:focus {
            border-color: var(--dodgers-light);
            background: rgba(255, 255, 255, 0.08);
        }

        .module-search input::placeholder {
            color: var(--text-muted);
        }

        .module-file-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .module-file-item {
            padding: 11px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 4px;
            font-size: 0.88rem;
        }

        .module-file-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .module-file-item.active {
            background: rgba(0, 90, 156, 0.22);
            color: #fff;
            font-weight: 600;
        }

        .module-preview {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .preview-toolbar {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
        }

        .preview-title {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .preview-actions {
            display: flex;
            gap: 8px;
        }

        .preview-body {
            flex: 1;
            overflow-y: auto;
            padding: 28px 34px;
            background: #fff;
            color: #1f2937;
        }

        .preview-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 4px;
        }

        /* Markdown preview styling */
        .markdown-body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.75;
            max-width: 880px;
            margin: 0 auto;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3 {
            color: var(--text);
            margin-top: 28px;
            margin-bottom: 14px;
            font-weight: 700;
        }

        .markdown-body h1 { font-size: 1.9rem; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .markdown-body h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .markdown-body h3 { font-size: 1.2rem; }

        .markdown-body p { margin-bottom: 14px; }

        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin: 18px 0;
            font-size: 0.92rem;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }

        .markdown-body th {
            background: rgba(30, 136, 229, 0.12);
            font-weight: 600;
        }

        .markdown-body tr:nth-child(even) { background: rgba(255, 255, 255, 0.03); }

        .markdown-body ul, .markdown-body ol {
            margin: 14px 0;
            padding-left: 24px;
        }

        .markdown-body li { margin-bottom: 6px; }

        .markdown-body blockquote {
            border-left: 4px solid var(--dodgers-blue);
            padding: 10px 18px;
            margin: 16px 0;
            background: rgba(30, 41, 59, 0.6);
            color: var(--text-muted);
        }

        .markdown-body code {
            background: rgba(30, 41, 59, 0.9);
            color: #7dd3fc;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .markdown-body pre {
            background: #1f2937;
            color: #e5e7eb;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 40px;
        }

        .empty-state-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.6; }
        .empty-state h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }

        /* Responsive */
        @media (max-width: 1024px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar {
                height: auto;
                position: relative;
                flex-direction: row;
                align-items: center;
                padding: 12px 16px;
            }
            .brand { border-bottom: none; border-right: 1px solid var(--border); padding: 0 16px 0 0; margin-right: 16px; }
            nav { display: flex; padding: 0; flex: 1; overflow-x: auto; overflow-y: hidden; }
            .nav-group { display: flex; align-items: center; }
            .nav-group-title { display: none; }
            .nav-item { margin-bottom: 0; margin-right: 6px; white-space: nowrap; }
            .sidebar-footer { display: none; }
            .module-layout { grid-template-columns: 1fr; height: auto; }
            .module-sidebar { max-height: 300px; }
        }

        @media (max-width: 768px) {
            .content { padding: 20px 18px; }
            header { padding: 16px 18px; flex-direction: column; align-items: flex-start; gap: 12px; }
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        .hidden { display: none !important; }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .error-box {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            padding: 16px 20px;
            border-radius: 10px;
            margin: 20px;
        }
        /* Schedule & Game Hub (gh-*) — gh 前缀避免与数据大屏的 .schedule-card 行样式冲突 */
        .gh-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
            margin-bottom: 22px;
        }
        @media (max-width: 1024px) {
            .gh-grid { grid-template-columns: 1fr; }
        }
        .gh-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
        }
        .gh-card > h3 {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .gh-tag {
            background: rgba(255,255,255,0.08);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .gh-matchup {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin: 14px 0;
            padding: 16px;
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
        }
        .gh-team {
            text-align: center;
            flex: 1;
        }
        .gh-team-abbr {
            font-weight: 800;
            font-size: 1.3rem;
        }
        .gh-team-name {
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .gh-vs {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 700;
        }
        .gh-meta {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 10px;
            text-align: center;
        }
        .gh-pitcher {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .gh-pitcher:last-child { border-bottom: none; }
        .gh-pitcher-side { font-weight: 600; min-width: 72px; color: var(--text-muted); }
        .gh-pitcher-name { flex: 1; font-weight: 600; }
        .gh-pitcher-stats { font-size: 0.82rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }

        /* 上一场：比分 + 结果徽章 */
        .gh-score-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin: 6px 0 4px;
        }
        .gh-score {
            font-size: 2.5rem;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }
        .gh-score.win { color: var(--success); }
        .gh-score.loss { color: var(--danger); }
        .gh-result {
            padding: 3px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.85rem;
        }
        .gh-result.win { background: rgba(34,197,94,0.18); color: var(--success); }
        .gh-result.loss { background: rgba(239,68,68,0.18); color: var(--danger); }

        /* 上一场：迷你 line score 表格 */
        .ls-wrap { overflow-x: auto; margin: 12px 0 4px; }
        .ls-table {
            border-collapse: collapse;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 0.78rem;
            margin: 0 auto;
        }
        .ls-table td, .ls-table th {
            padding: 4px 7px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .ls-table th { color: var(--text-muted); font-weight: 600; }
        .ls-table td:first-child, .ls-table th:first-child { text-align: left; font-weight: 700; }
        .ls-table .ls-rhe { font-weight: 800; color: #fff; }
        .ls-table tr.ls-lad td { color: #fff; }
        .ls-table tr.ls-lad td:first-child { color: var(--dodgers-light); }

        /* 上一场：关键得分 chips */
        .gh-moments-label { font-size: 0.8rem; color: var(--text-muted); margin: 16px 0 8px; font-weight: 600; }
        .gh-moments { display: flex; flex-direction: column; gap: 6px; }
        .moment-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-left-width: 3px;
            font-size: 0.85rem;
        }
        .moment-chip.m-dodgers { border-left-color: var(--success); }
        .moment-chip.m-opp { border-left-color: var(--danger); }
        .moment-inning { font-weight: 700; color: var(--text-muted); min-width: 46px; }
        .moment-text { flex: 1; }
        .moment-score { font-weight: 800; font-variant-numeric: tabular-nums; }
        .moment-chip.m-dodgers .moment-score { color: var(--success); }
        .moment-chip.m-opp .moment-score { color: var(--danger); }
        .gh-more { font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; text-align: right; }

        /* 系列赛 */
        .gh-series-head {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin: 6px 0 2px;
        }
        .gh-series-num { font-size: 1.9rem; font-weight: 900; }
        .gh-series-num.opp { color: var(--text-muted); }
        .series-pips {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 16px 0 4px;
            flex-wrap: wrap;
        }
        .series-pip {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
            min-width: 70px;
        }
        .series-pip.win { border: 1px solid rgba(34,197,94,0.35); }
        .series-pip.loss { border: 1px solid rgba(239,68,68,0.35); }
        .series-pip.upcoming { border: 1px dashed var(--border); opacity: 0.7; }
        .pip-dot { width: 10px; height: 10px; border-radius: 50%; }
        .series-pip.win .pip-dot { background: var(--success); }
        .series-pip.loss .pip-dot { background: var(--danger); }
        .series-pip.upcoming .pip-dot { background: transparent; border: 2px solid var(--text-muted); }
        .pip-score { font-weight: 800; font-size: 0.95rem; }
        .series-pip.win .pip-score { color: var(--success); }
        .series-pip.loss .pip-score { color: var(--danger); }
        .pip-date { font-size: 0.7rem; color: var(--text-muted); }
        .gh-series-status { text-align: center; font-size: 0.82rem; color: var(--text-muted); margin-top: 12px; }

        /* 日历 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }
        .calendar-day-header {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 6px 0;
        }
        .calendar-cell {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 0.75rem;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .calendar-cell:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--border);
        }
        .calendar-cell-win { background: rgba(34,197,94,0.12); border-color: rgba(34,197,94,0.25); }
        .calendar-cell-loss { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.25); }
        .calendar-cell-today { box-shadow: 0 0 0 2px var(--dodgers-light); }
        .calendar-cell-day { font-size: 0.7rem; color: var(--text-muted); }
        .calendar-cell-opp { font-weight: 700; }
        .calendar-cell-result { font-size: 0.7rem; }
        .calendar-legend {
            display: flex;
            gap: 18px;
            justify-content: flex-end;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 12px;
        }
        .calendar-legend span { display: inline-flex; align-items: center; gap: 6px; }
        .legend-swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
        .legend-swatch.win { background: rgba(34,197,94,0.5); }
        .legend-swatch.loss { background: rgba(239,68,68,0.5); }
        .legend-swatch.today { border: 2px solid var(--dodgers-light); background: transparent; }

        .schedule-loading {
            padding: 60px;
            text-align: center;
            color: var(--text-muted);
        }
        .schedule-error {
            padding: 40px;
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: var(--radius);
            color: #fecaca;
        }

        /* Depth Chart (名单深度图) */
        .dc-summary { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
        .dc-chip {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
        }
        .dc-chip b { font-size: 1rem; margin-left: 4px; }
        .dc-chip.c-active b { color: var(--success); }
        .dc-chip.c-il b { color: var(--accent); }
        .dc-chip.c-minors b { color: var(--text-muted); }
        .dc-board {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(160px, 1fr);
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .dc-col {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .dc-col-head {
            text-align: center;
            font-weight: 700;
            font-size: 0.88rem;
            padding: 4px 0 8px;
            border-bottom: 1px solid var(--border);
            color: var(--dodgers-light);
        }
        .dc-col-head span { color: var(--text-muted); font-weight: 500; font-size: 0.75rem; margin-left: 4px; }
        .dc-player {
            display: flex;
            gap: 9px;
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            transition: all 0.15s;
        }
        .dc-player.clickable { cursor: pointer; }
        .dc-player.clickable:hover {
            border-color: var(--dodgers-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
        }
        .dc-player.inactive { opacity: 0.6; }
        .dc-photo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background: rgba(255,255,255,0.06);
            flex-shrink: 0;
        }
        .dc-info { min-width: 0; }
        .dc-name {
            font-weight: 700;
            font-size: 0.84rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dc-name .dc-jersey { color: var(--text-muted); font-weight: 500; font-size: 0.72rem; margin-left: 4px; }
        .dc-flag {
            font-size: 0.66rem;
            background: rgba(0,90,156,0.4);
            color: #fff;
            padding: 1px 6px;
            border-radius: 8px;
            margin-left: 5px;
            font-weight: 600;
        }
        .dc-stats {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dc-status {
            display: inline-block;
            font-size: 0.66rem;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 10px;
            margin-top: 3px;
        }
        .dc-status.st-active { background: rgba(34,197,94,0.18); color: var(--success); }
        .dc-status.st-il { background: rgba(255,152,0,0.18); color: var(--accent); }
        .dc-status.st-il60 { background: rgba(239,68,68,0.18); color: var(--danger); }
        .dc-status.st-minors { background: rgba(148,163,184,0.18); color: var(--text-muted); }
        .dc-sec { margin-top: 26px; }
        .dc-sec-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .dc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
        /* ---------- 新闻中心 ---------- */
        .news-digest {
            background: linear-gradient(135deg, rgba(0,90,156,0.25) 0%, rgba(30,136,229,0.08) 100%);
            border: 1px solid rgba(30,136,229,0.35);
            border-radius: var(--radius);
            padding: 18px 22px;
            margin-bottom: 16px;
        }
        .news-digest-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .news-digest-head h3 {
            font-size: 1.05rem;
            font-weight: 700;
        }
        .news-digest-time {
            font-size: 0.72rem;
            color: var(--text-muted);
        }
        .news-digest-time.stale {
            color: var(--accent);
        }
        .news-digest ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .news-digest li {

        /* ---------- 球员对比 ---------- */

        function fmtPitcher(name, stats) {
            if (!name) return { name: '待定', stats: '' };
            const s = stats ? `${stats.w}胜${stats.l}负 · ${stats.era} ERA` : '';
            return { name, stats: s };
        }

        function buildLinescoreTable(linescore) {
            if (!linescore) return '';
            const rows = linescore.trim().split('\n').map(l => l.trim()).filter(l => l);
            const parsed = rows.map(line => line.split(/\s+/)).filter(t => t.length >= 5);
            const teams = parsed.filter(t => isNaN(parseInt(t[0])) && t[0] !== 'Final');
            if (teams.length < 2) return '';
            const header = parsed.find(t => t[0] === 'Final');
            const nCols = Math.max(...teams.map(t => t.length));
            const nInnings = nCols - 4; // 队名 + R H E
            let inningNums = [];
            if (header && header.length >= nCols) {
                inningNums = header.slice(1, 1 + nInnings);
            } else {
                inningNums = Array.from({ length: nInnings }, (_, i) => String(i + 1));
            }
            let html = '<div class="ls-wrap"><table class="ls-table"><thead><tr><th></th>';
            inningNums.forEach(n => { html += `<th>${n}</th>`; });
            html += '<th>R</th><th>H</th><th>E</th></tr></thead><tbody>';
            teams.forEach(t => {
                const isLAD = t[0].toLowerCase().includes('dodgers');
                const nums = t.slice(1);
                html += `<tr class="${isLAD ? 'ls-lad' : ''}"><td>${t[0]}</td>`;
                for (let i = 0; i < nInnings; i++) html += `<td>${nums[i] !== undefined ? nums[i] : ''}</td>`;
                const rhe = nums.slice(nInnings, nInnings + 3);
                html += `<td class="ls-rhe">${rhe[0] !== undefined ? rhe[0] : ''}</td><td>${rhe[1] !== undefined ? rhe[1] : ''}</td><td>${rhe[2] !== undefined ? rhe[2] : ''}</td></tr>`;
            });
            html += '</tbody></table></div>';
            return html;
        }

                        return `<div class="series-pip upcoming"><span class="pip-dot"></span><span class="pip-score">VS</span><span class="pip-date">${dateShort} 待赛</span></div>`;
                    }
                    const w = g.result === 'W';
                    const sc = g.score || { dodgers: '-', opponent: '-' };
                    return `<div class="series-pip ${w ? 'win' : 'loss'}"><span class="pip-dot"></span><span class="pip-score">${sc.dodgers}-${sc.opponent}</span><span class="pip-date">${dateShort}</span></div>`;
                }).join('');
                const statusText = series.nextGameDate
                    ? `已赛 ${series.gamesPlayed}/${series.totalGames} 场 · 下一场 ${series.nextGameBeijingTime || series.nextGameDate}`
                    : `系列赛结束 · 道奇 ${series.wins}-${series.losses} ${series.opponentAbbreviation}`;
                seriesHtml = `
                    <div class="gh-card" style="margin-bottom:22px;">
                        <h3>⚔️ 当前系列赛 · vs ${series.opponentAbbreviation} <span class="gh-tag">${series.totalGames} 场</span></h3>
                        <div class="gh-series-head">
                            <span class="gh-series-num">LAD ${series.wins}</span>
                            <span class="gh-vs">—</span>
                            <span class="gh-series-num opp">${series.losses} ${series.opponentAbbreviation}</span>
                        </div>
                        <div class="series-pips">${pips}</div>
                        <div class="gh-series-status">${statusText}</div>
                    </div>
                `;
            }

            /* ---------- 日历 ---------- */
            const today = new Date();
            const monthDays = new Date(calendar.year, calendar.month, 0).getDate();
            const firstDay = new Date(calendar.year, calendar.month - 1, 1).getDay();
            const gameMap = {};
            (calendar.games || []).forEach(g => { gameMap[g.day] = g; });

            const dayHeaders = ['日','一','二','三','四','五','六'];
            let cells = '';
            for (let i = 0; i < firstDay; i++) cells += `<div class="calendar-cell" style="visibility:hidden;"></div>`;
            for (let d = 1; d <= monthDays; d++) {
                const g = gameMap[d];
                let cls = '';
                let inner = `<span class="calendar-cell-day">${d}</span>`;
                if (g) {
                    cls = g.result === 'W' ? 'calendar-cell-win' : (g.result === 'L' ? 'calendar-cell-loss' : '');
                    inner += `<span class="calendar-cell-opp">${g.isHome ? 'vs' : '@'}${g.opponent}</span>`;
                    if (g.status === 'Final' && g.score) {
                        inner += `<span class="calendar-cell-result">${g.score.dodgers}-${g.score.opponent}</span>`;
                    }
                }
                if (today.getDate() === d && today.getMonth() + 1 === calendar.month && today.getFullYear() === calendar.year) {
                    cls += ' calendar-cell-today';
                }
                const clickable = g ? 'calendar-cell-clickable' : '';
                const title = g ? ` title="点击查看 ${calendar.month}月${d}日 比赛详情与战报"` : '';
                const onclick = g ? ` onclick="openGameModal(${d})"` : '';
                cells += `<div class="calendar-cell ${cls} ${clickable}"${title}${onclick}>${inner}</div>`;
            }
            window._calGames = gameMap;
            window._calMeta = { year: calendar.year, month: calendar.month };

            const calendarHtml = `
                <div class="gh-card" style="margin-bottom:22px;">
                    <h3>📅 ${calendar.year}年${calendar.month}月 赛程日历</h3>
                    <div class="calendar-grid">
                        ${dayHeaders.map(h => `<div class="calendar-day-header">${h}</div>`).join('')}
                        ${cells}
                    </div>
                    <div class="calendar-legend">
                        <span><span class="legend-swatch win"></span>胜</span>
                        <span><span class="legend-swatch loss"></span>负</span>
                        <span><span class="legend-swatch today"></span>今天</span>
                    </div>
                </div>
            `;

            content.innerHTML = `
                <div class="gh-grid">
                    ${nextHtml}
                    ${lastHtml}
                </div>
                ${seriesHtml}
                ${calendarHtml}
                <div class="data-age">数据时间：${generated} · 来源：MLB Stats API ${sourceBadge}</div>
            `;
        }

        /* ---------- 比赛详情弹窗（日历点击） ---------- */
        // MLB 晚间比赛：美国当地日期 D = 北京时间 D+1（上午场同理，全部为 +1）
        function usToBeijingDate(usDate) {
            const d = new Date(usDate + 'T00:00:00Z');
            d.setUTCDate(d.getUTCDate() + 1);
            return d.toISOString().slice(0, 10);
        }

        function closeGameModal() {
            const ov = document.querySelector('.game-modal-overlay');
            if (ov) ov.remove();
        }

        function openGameModal(day) {
            const g = (window._calGames || {})[day];
            if (!g) return;
            closeGameModal();
            const meta = window._calMeta || {};
            const usDate = g.date || `${meta.year}-${String(meta.month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const bjDate = usToBeijingDate(usDate);
            const isFinal = g.status === 'Final';
            const resultTxt = isFinal
                ? (g.result === 'W' ? '<span class="gm-result-w">胜</span>' : '<span class="gm-result-l">负</span>')
                : `<span style="color:var(--accent)">${g.status || '未赛'}</span>`;
            const scoreTxt = (isFinal && g.score) ? `${g.score.dodgers} - ${g.score.opponent}` : 'vs';

            const overlay = document.createElement('div');
            overlay.className = 'game-modal-overlay';
            overlay.onclick = e => { if (e.target === overlay) closeGameModal(); };
            overlay.innerHTML = `
                <div class="game-modal">
                    <div class="game-modal-head">
                        <div class="game-modal-title">
                            ${g.isHome ? 'vs' : '@'} ${g.opponentName || g.opponent} · ${resultTxt}
                            <div class="game-modal-score">${scoreTxt}</div>
                        </div>
                        <button class="game-modal-close" onclick="closeGameModal()">✕</button>
                    </div>
                    <div class="game-modal-dates">
                        <span>🇺🇸 美国当地时间 <strong>${usDate}</strong></span>
                        <span>🇨🇳 北京时间 <strong>${bjDate}</strong>（次日，MLB 晚场对应北京时间次日上午）</span>
                    </div>
                    <div class="game-modal-body">
                        <div id="gm-live"><div class="schedule-loading"><div>⏳ 正在从 MLB Stats API 获取${isFinal ? '战报' : '预告'}...</div></div></div>
                        <div id="gm-local"></div>
                        <div class="gm-links" id="gm-links"></div>
                    </div>
                </div>`;
            document.body.appendChild(overlay);

            loadGameLive(usDate, g, isFinal);
            loadGameLocal(usDate, bjDate, g);
        }

        async function loadGameLive(usDate, g, isFinal) {
            const box = document.getElementById('gm-live');
            const links = document.getElementById('gm-links');
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 15000);
            try {
                const url = `https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=119&date=${usDate}&hydrate=linescore,probablePitcher,decisions`;
                const r = await fetch(url, { signal: ctrl.signal });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const j = await r.json();
                const game = (j.dates && j.dates[0] && j.dates[0].games && j.dates[0].games[0]);
                if (!game) throw new Error('该日期没有找到比赛');
                const pk = game.gamePk;
                const ls = game.linescore;
                let html = '';
                if (ls && ls.innings && ls.innings.length) {
                    const n = ls.innings.length;
                    let head = '<tr><th class="gm-team">球队</th>';
                    for (let i = 1; i <= n; i++) head += `<th>${i}</th>`;
                    head += '<th>R</th><th>H</th><th>E</th></tr>';
                    const row = (side, teamName, isWinner) => {
                        let tds = '';
                        for (let i = 0; i < n; i++) {
                            const inn = ls.innings[i][side];
                            tds += `<td>${inn && inn.runs != null ? inn.runs : '-'}</td>`;
                        }
                        const t = ls.teams[side];
                        return `<tr class="${isWinner ? 'gm-winner' : ''}"><td class="gm-team">${teamName}</td>${tds}<td class="gm-total">${t.runs ?? '-'}</td><td>${t.hits ?? '-'}</td><td>${t.errors ?? '-'}</td></tr>`;
                    };
                    const winner = ls.teams.home.runs > ls.teams.away.runs ? 'home' : 'away';
                    const awayName = (game.teams && game.teams.away && game.teams.away.team && game.teams.away.team.name) || '客队';
                    const homeName = (game.teams && game.teams.home && game.teams.home.team && game.teams.home.team.name) || '主队';
                    html += `<div class="gm-section-title">📊 逐局比分</div><table class="gm-linescore">${head}${row('away', awayName, winner === 'away')}${row('home', homeName, winner === 'home')}</table>`;
                }
                const dec = game.decisions;
                if (dec) {
                    const parts = [];
                    if (dec.winner) parts.push(`胜投 <strong>${dec.winner.fullName}</strong>`);
                    if (dec.loser) parts.push(`败投 <strong>${dec.loser.fullName}</strong>`);
                    if (dec.save) parts.push(`救援 <strong>${dec.save.fullName}</strong>`);
                    if (parts.length) html += `<div class="gm-decisions">${parts.join('<span>·</span>')}</div>`;
                }
                const pp = game.probablePitchers;
                if (!isFinal && pp) {
                    const dodgersP = g.isHome ? pp.home : pp.away;
                    const oppP = g.isHome ? pp.away : pp.home;
                    const fmt = p => (p && p.fullName) ? p.fullName : '待定';
                    html += `<div class="gm-decisions"><span>道奇先发：<strong>${fmt(dodgersP)}</strong></span><span>对手先发：<strong>${fmt(oppP)}</strong></span></div>`;
                }
                if (box) box.innerHTML = html || '<div class="gm-note">MLB API 未返回详细数据</div>';
                if (links && pk) {
                    const a = document.createElement('a');
                    a.href = `https://www.mlb.com/gameday/${pk}`;
                    a.target = '_blank'; a.rel = 'noopener';
                    a.innerHTML = '<button class="btn btn-primary">📋 MLB.com 官方完整战报</button>';
                    links.appendChild(a);
                }
            } catch (e) {
                if (box) box.innerHTML = `<div class="gm-note">⚠ MLB 实时数据获取失败（${e.message || '网络问题'}），下方本地内容仍可使用。</div>`;
            } finally {
                clearTimeout(timer);
            }
        }

        async function loadGameLocal(usDate, bjDate, g) {
            const box = document.getElementById('gm-local');
            const links = document.getElementById('gm-links');
            if (!box) return;
            let html = `<div class="gm-section-title">📰 当日内容（北京时间 ${bjDate}）</div>`;
            // 按北京时间索引（美国比赛日 +1）：日报条目在 FILE_INDEX.daily 里，带归档 folder
            const dayEntry = ((FILE_INDEX.daily || []).find(x => x.date === bjDate)) || null;
            const dayFolder = (dayEntry && dayEntry.folder) || 'roster';
            // 1) 当日阵容快照
            try {
                const r = await fetch(`${dayFolder}/${bjDate}.md?v=` + Date.now());
                if (r.ok) {
                    const md = await r.text();
                    html += `<div class="gm-snapshot"><div class="markdown-body">${marked.parse(md)}</div></div>`;
                } else {
                    html += `<div class="gm-note">当日阵容快照（${bjDate}.md）不存在</div>`;
                }
            } catch (e) {
                html += '<div class="gm-note">快照读取失败</div>';
            }
            // 2) 当日日报链接（按北京时间索引：美国比赛日 +1）
            try {
                if (dayEntry && links) {
                    const b = document.createElement('button');
                    b.className = 'btn btn-primary';
                    b.textContent = `⚾ 查看当日日报（${bjDate}）`;
                    b.onclick = () => { closeGameModal(); setPage('daily'); setTimeout(() => selectFile('daily', dayEntry.name), 80); };
                    links.appendChild(b);
                }
            } catch (e) { /* 日报索引不可用时忽略 */ }
            // 3) 所属周报（覆盖该美国日期的周）作为次级入口
            try {
                const d = new Date(usDate + 'T00:00:00Z');
                const monday = new Date(d);
                monday.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
                const mondayStr = monday.toISOString().slice(0, 10);
                const weeks = (FILE_INDEX.weekly || []);
                const hit = weeks.find(w => w.date === mondayStr);
                if (hit && links) {
                    const b = document.createElement('button');
                    b.className = 'btn btn-ghost';
                    b.textContent = `📊 所属周报 · ${hit.label}`;
                    b.onclick = () => { closeGameModal(); setPage('weekly'); setTimeout(() => selectFile('weekly', hit.name), 80); };
                    links.appendChild(b);
                }
            } catch (e) { /* 周报索引不可用时忽略 */ }
            box.innerHTML = html;
        }

        /* ---------- 名单深度图 ---------- */
        function dcStatusClass(s) {
            if (s === '活跃') return 'st-active';
            if (s === 'IL-60') return 'st-il60';
            if (s && s.startsWith('IL')) return 'st-il';
            return 'st-minors';
        }

        function dcPlayerCard(p, mode) {
            const bat = p.bat, pit = p.pitch;
            let statsLine;
            if (mode === 'pitch' && pit) {
                statsLine = pit.era != null
                    ? `${pit.w}胜${pit.l}负 · ERA ${pit.era} · ${pit.so}K${pit.gs ? ' · ' + pit.gs + '先发' : ''}`
                    : `${pit.g || 0} 场`;
            } else if (bat && bat.avg) {
                statsLine = `${bat.avg}/${bat.obp}/${bat.slg} · ${bat.hr} HR · ${bat.rbi} RBI`;
            } else if (pit) {
                statsLine = pit.era != null ? `ERA ${pit.era} · ${pit.w}胜${pit.l}负` : '本赛季无大联盟数据';
            } else {
                statsLine = '本赛季无大联盟数据';
            }
            const photo = p.headshot
                ? `<img class="dc-photo" src="${p.headshot}" alt="" onerror="this.style.display='none'">`
                : '<div class="dc-photo"></div>';
            const flag = p.twoWay ? '<span class="dc-flag">二刀流</span>' : '';
            const click = p.reportUrl ? `onclick="window.open('${p.reportUrl}','_blank')"` : '';
            const cls = `dc-player ${p.reportUrl ? 'clickable' : ''} ${p.status === '活跃' ? '' : 'inactive'}`;
            return `
                <div class="${cls}" ${click} title="${p.reportUrl ? '点击查看球探报告' : ''}">
                    ${photo}
                    <div class="dc-info">
                        <div class="dc-name">${p.name}${flag}<span class="dc-jersey">#${p.jersey || '-'}</span></div>
                        <div class="dc-stats">${statsLine}</div>
                        <span class="dc-status ${dcStatusClass(p.status)}">${p.status}</span>
                    </div>
                </div>
            `;
        }

                    if (p.callupWatch) watchNames.add(p.name.toLowerCase());

            });
            const isWatch = name => {
                const n = name.toLowerCase();
                for (const w of watchNames) {
                    if (n.includes(w.split(' ').pop()) || w.includes(n.split(' ').pop())) return true;

            const ovBadge = ov => {

                    .filter(p => p.eta && parseInt(p.eta) <= 2027)

            const fmtDate = iso => {

                const d = new Date(iso + 'T00:00:00');
                return `${d.getMonth() + 1}/${d.getDate()}`;
            };

            // 2) 亮点 feed

                    <div style="display:flex;flex-direction:column;gap:8px;">

            // 3) 层级领跑者
            const leaderCards = data.affiliates.map(a => {
                const hRows = (a.leaders.hitters || []).map(h => `
                    <tr>
                        <td><span class="st-team">${h.name}</span>${h.callupWatch ? '<span class="farm-watch">🔥 上调预警</span>' : ''}</td>
                        <td>${h.avg}/${h.obp}/${h.slg}</td>

                        ${pRows ? `<div class="dc-stats" style="margin:12px 0 4px;">投球（ERA 排序，IP≥35）</div>
                        <table class="st-table compact"><thead><tr><th>球员</th><th>ERA</th><th>WHIP</th><th>W-L</th><th>SO</th><th>IP</th></tr></thead><tbody>${pRows}</tbody></table>` : '<div class="dc-stats" style="margin-top:12px;">投球数据不足</div>'}
                    </div>
                `;
            }).join('');

            content.innerHTML = `
                <div class="dashboard-section">
                    <div class="dashboard-section-title">🏟️ 附属球队 <span class="gh-tag">${data.season} 赛季</span></div>

        /* ---------- 季后赛对阵追踪（金色十月） ---------- */
        async function fetchJsonWithBak(url, bakUrl) {
            try {
                const res = await fetch(url + '?v=' + Date.now());
                if (res.ok) return { data: await res.json(), source: 'current' };
                throw new Error('http ' + res.status);
            } catch (e) {
                if (bakUrl) {
                    try {
                        const bak = await fetch(bakUrl);
                        if (bak.ok) return { data: await bak.json(), source: 'backup' };
                    } catch (e2) { /* ignore */ }
                }
                return { data: null, source: 'none' };
            }
        }

        function psTeam(bracket, league, seed) {
            const lg = bracket && bracket[league];
            return lg && lg.teams ? lg.teams[String(seed)] : null;
        }

        function psFindTeam(bracket, league, id) {
            const teams = ((bracket || {})[league] || {}).teams || {};
            for (const k of Object.keys(teams)) if (teams[k].id === id) return teams[k];
            return null;
        }

        function psWinnerId(series, bestOf) {
            if (!series || !series.wins) return null;
            const need = Math.floor(bestOf / 2) + 1;
            for (const tid of Object.keys(series.wins)) {
                if (series.wins[tid] >= need) return parseInt(tid);
            }
            return null;
        }

        function psRow(t, wins, placeholder) {
            if (!t) return `<div class="ps-team ps-tbd"><span class="ps-seed">·</span><span class="ps-name">${placeholder}</span><span class="ps-wins"></span></div>`;
            const isLad = t.id === 119;
            return `<div class="ps-team ${isLad ? 'ps-lad' : ''}">
                <span class="ps-seed">${t.seed ? '#' + t.seed : ''}</span>
                <span class="ps-name">${t.abbr || t.name}${isLad ? ' 🐻' : ''}</span>
                <span class="ps-rec">${t.w != null ? t.w + '-' + t.l : ''}</span>
                <span class="ps-wins">${wins != null ? wins : ''}</span>
            </div>`;
        }

        function psDots(series) {
            if (!series || !series.games || !series.games.length) return '';
            const dots = series.games.map(g => {
                if (!g.final) return `<span class="ps-dot ps-dot-soon" title="G${g.gameNumber} · ${g.beijing || '时间待定'} (北京时间) 未赛">·</span>`;
                const ladSide = g.away.id === 119 ? 'away' : (g.home.id === 119 ? 'home' : null);
                let cls = 'ps-dot', mark;
                if (ladSide) {
                    const won = ladSide === g.winnerSide;
                    mark = won ? 'W' : 'L';
                    cls += won ? ' ps-dot-w' : ' ps-dot-l';
                } else {
                    const w = g.winnerSide === 'away' ? g.away : g.home;
                    mark = (w.abbr || (w.name || '?')).slice(0, 3);
                    cls += ' ps-dot-n';
                }
                return `<span class="${cls}" title="G${g.gameNumber} ${g.away.name} ${g.away.score != null ? g.away.score : '-'} : ${g.home.score != null ? g.home.score : '-'} ${g.home.name}">${mark}</span>`;
            }).join('');
            return `<div class="ps-dots">${dots}</div>`;
        }

        function psCard(title, bestOf, rowsHtml, series, fallbackNote) {
            const played = series ? (series.gamesPlayed || 0) : 0;
            const next = series ? (series.games || []).find(g => !g.final) : null;
            let foot = fallbackNote || '';
            if (series) {
                if (next) foot = `G${next.gameNumber} · ${next.beijing || '时间待定'}（北京时间）`;
                else if (played) foot = '系列赛结束';
            }
            return `<div class="ps-series">
                <div class="ps-series-head"><span>${title}</span><span class="ps-bo">${bestOf} 战 ${Math.floor(bestOf / 2) + 1} 胜</span></div>
                ${rowsHtml}
                ${psDots(series)}
                <div class="ps-series-foot">${foot}</div>
            </div>`;
        }

        function psSeriesRows(series, teamA, teamB, phA, phB) {
            const w = tid => (series && series.wins && tid != null) ? (series.wins[tid] || 0) : null;
            return psRow(teamA, teamA ? w(teamA.id) : null, phA) + psRow(teamB, teamB ? w(teamB.id) : null, phB);
        }

        function psLeagueHtml(lg, bracket, rounds) {
            const R = ((rounds || {})[lg]) || {};
            const wc = R.wc || [null, null];
            const ds = R.ds || [null, null];
            const w3v6 = psWinnerId(wc[0], 3), w4v5 = psWinnerId(wc[1], 3);
            const wdsA = psWinnerId(ds[0], 5), wdsB = psWinnerId(ds[1], 5);
            const t3v6 = w3v6 ? psFindTeam(bracket, lg, w3v6) : null;
            const t4v5 = w4v5 ? psFindTeam(bracket, lg, w4v5) : null;
            const tdsA = wdsA ? psFindTeam(bracket, lg, wdsA) : null;
            const tdsB = wdsB ? psFindTeam(bracket, lg, wdsB) : null;
            const name = (bracket[lg] && bracket[lg].name) || lg;
            return `<div class="ps-league">
                <div class="ps-league-head">${name} · ${lg}</div>
                <div class="ps-round-label">外卡轮</div>
                ${psCard('外卡系列赛 A', 3, psSeriesRows(wc[0], psTeam(bracket, lg, 3), psTeam(bracket, lg, 6), '', ''), wc[0], '外卡轮待开赛')}
                ${psCard('外卡系列赛 B', 3, psSeriesRows(wc[1], psTeam(bracket, lg, 4), psTeam(bracket, lg, 5), '', ''), wc[1], '外卡轮待开赛')}
                <div class="ps-round-label">分区系列赛</div>
                ${psCard('分区系列赛 A', 5, psSeriesRows(ds[0], psTeam(bracket, lg, 1), t3v6, '', '#3/#6 胜者'), ds[0], '等待外卡结果')}
                ${psCard('分区系列赛 B', 5, psSeriesRows(ds[1], psTeam(bracket, lg, 2), t4v5, '', '#4/#5 胜者'), ds[1], '等待外卡结果')}
                <div class="ps-round-label">联盟冠军赛</div>
                ${psCard('联盟冠军赛', 7, psSeriesRows(R.cs || null, tdsA, tdsB, '分区赛 A 胜者', '分区赛 B 胜者'), R.cs || null, '等待分区赛结果')}
            </div>`;
        }

            const dashPaths = [];
            if (year === cur) dashPaths.push('portal/dashboard-data.json');

            const postPaths = [];

            postPaths.push(`seasons/${year}/snapshots/postseason.json`);

            const st = (dash && dash.standings) || {};

            // 赛季总结叙事文档（可选，位于 seasons/YYYY/ 根下）
            const summaryPath = `seasons/${year}/${year}-赛季总结.md`;

            const srcTag = (label, ok) => ok ? label : null;
            hint.textContent = [

            const seedChip = (lg, seed) => {

                return `<div class="rc-chip"><span class="ps-seed">#${seed}</span><span>${tm.name}</span><i>${tm.w}-${tm.l}</i></div>`;

            const seedBlock = lg => [1, 2, 3, 4, 5, 6].map(s => seedChip(lg, s)).join('');

            const leaderChip = (r, key, fmt) => r ? `<div class="rc-chip"><span>${r.name}</span><b>${fmt ? fmt(r[key]) : r[key]}</b></div>` : '';

            ].filter(Boolean));
            const pitBlock = leaderBlock('⚾ 投球领袖', [
                ...(P.w || []).map(r => leaderChip(r, 'wins')),
                ...(P.era || []).map(r => leaderChip(r, 'era')),

            const weekItems = weeklyFiles.map(f => `

            const summarySection = hasSummary ? `

            body.innerHTML = `

                <div class="dashboard-section">
                    <div class="dashboard-section-title">📊 ${year} 常规赛最终封存 <span class="gh-tag">162 场完整战绩</span></div>
                    <div class="rc-hero">
                        <div class="dashboard-card"><div class="rc-num">${st.wins != null ? st.wins + '-' + st.losses : '-'}</div><div class="rc-label">最终战绩</div></div>
                        <div class="dashboard-card"><div class="rc-num">${st.pct || '-'}</div><div class="rc-label">胜率</div></div>
                        <div class="dashboard-card"><div class="rc-num">${st.leagueRank ? '国联 #' + st.leagueRank : '-'}</div><div class="rc-label">国联排名</div></div>
                        <div class="dashboard-card"><div class="rc-num">${st.homeRecord || '-'}</div><div class="rc-label">主场</div></div>
                        <div class="dashboard-card"><div class="rc-num">${st.awayRecord || '-'}</div><div class="rc-label">客场</div></div>
                        <div class="dashboard-card"><div class="rc-num">${(st.streak && st.streak.streakCode) || '-'}</div><div class="rc-label">收官连胜</div></div>
                    </div>
                </div>

                <div class="dashboard-section">
                    <div class="dashboard-section-title">🏅 国联西区最终排名</div>
                    <div class="dashboard-card" style="overflow-x:auto;">
                        <table class="st-table compact">
                            <thead><tr><th></th><th>球队</th><th>W-L</th><th>胜率</th><th>GB</th><th>近况</th></tr></thead>
                            <tbody>${westRows || '<tr><td colspan="6" class="dc-stats">无积分榜数据</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>

                <div class="dashboard-section">
                    <div class="dashboard-section-title">🎯 季后赛最终种子 <span class="gh-tag">分区冠军 1-3 · 外卡 4-6</span></div>
                    <div class="rc-leader-grid">
                        <div class="dashboard-card"><h3 style="margin-bottom:8px;">国联</h3>${seedBlock('NL') || '<p class="dc-stats">无种子数据</p>'}</div>
                        <div class="dashboard-card"><h3 style="margin-bottom:8px;">美联</h3>${seedBlock('AL') || '<p class="dc-stats">无种子数据</p>'}</div>
                    </div>
                </div>

                <div class="dashboard-section">
                    <div class="dashboard-section-title">👑 球队领袖 <span class="gh-tag">${year} 常规赛数据</span></div>
                    <div class="rc-leader-grid">${hitBlock}${pitBlock}</div>

                <div class="dashboard-section">
                    <div class="dashboard-section-title">📰 周战报全存档 <span class="gh-tag">常规赛 · 点击跳转阅读器</span></div>
                    <div class="dashboard-card">
                        <div class="module-file-list" style="max-height:320px;overflow-y:auto;">${weekItems || '<p class="dc-stats">暂无存档</p>'}</div>

                <div class="dashboard-section">

                    <div class="dashboard-card">

                </div>
                <div class="data-age">来源：dashboard-data.json（${(dash && dash.generatedAt) || '归档快照'}）+ postseason.json（${(post && post.generatedAt) || '归档快照'}）</div>
            `;
        }
